[package]
name = "flux-mandate-registry"
version = "0.1.0"
description = "Contract-linked authority registry for FluxMandate"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "flux_mandate_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token"] }

